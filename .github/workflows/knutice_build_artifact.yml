name: KNUTICE Automated CI CD Pipeline

on:
  push:
    branches:
      - development
      - release

jobs:
  build-aab:
    name: Build and Sign AAB Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Generate Local Properties
        env:
          ENCODED_PROPERTIES: ${{ secrets.BASE64_LOCAL_PROPERTIES }}
        run: echo "$ENCODED_PROPERTIES" | base64 --decode > ./local.properties

      - name: Provide Necessary Configuration File.
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$DATA" | base64 --decode > app/google-services.json

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Sign Production AAB
        id: sign_aab
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/bundle/release
          signingKey: ${{ secrets.PROD_KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.PROD_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.PROD_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.PROD_KEY_PASSWORD }}

      - name: Upload Signed Production AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KNUTICE-Signed-AAB-${{ github.ref_name }}
          path: ${{ steps.sign_aab.outputs.signedFile }}