name: KNUTICE Pr Compilation Pre-check

on:
  pull_request:
    branches:
      - development
      - release

jobs:
  verify-build:
    name: Fast Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Generate Local Properties
        env:
          ENCODED_PROPERTIES: ${{ secrets.BASE64_LOCAL_PROPERTIES }}
        run: echo "$ENCODED_PROPERTIES" | base64 --decode > ./local.properties

      - name: Provide Necessary Configuration File.
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$DATA" | base64 --decode > app/google-services.json

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Verification Process
        run: ./gradlew lintDebug testDebug assembleDebug

      - name: Upload Test and Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Verification-Reports
          path: |
            **/build/reports/lint-results-debug.html
            **/build/reports/tests/testDebugUnitTest/
            
